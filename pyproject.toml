[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autotyper"
version = "1.0.0"
description = "A polished, cross-platform desktop auto-typing utility built with PySide6 and pynput."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Otachi" }]
keywords = ["autotyper", "keyboard", "automation", "pyside6", "pynput"]
classifiers = [
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Utilities",
]
dependencies = [
  "PySide6>=6.7,<7",
  "pynput>=1.7.6,<2",
]

[project.gui-scripts]
autotyper = "autotyper.app:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["autotyper*"]

[tool.setuptools.package-data]
autotyper = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:autotyper.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["autotyper", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "UP042"]
